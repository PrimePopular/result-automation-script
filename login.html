<!DOCTYPE html>
<html>
<head><title>Mock GOUNI Staff Access - Login</title></head>
<body id="pageBody" style="background-color: rgb(238,238,238); padding:20px; margin:0;">
  <div style="max-width:500px;">
    <div id="loginError" style="color:red;display:none;margin-bottom:10px;">Invalid username or password</div>
    <div>
      Username.:
      <input name="txtUsername" type="text" id="txtUsername" class="longInput">
      Password :
      <input name="txtpassword" type="password" id="txtpassword" class="longInput">
      <br><br>
      <input id="btnLogin" type="button" class="btn-blue" value="Login">
    </div>
  </div>
<script>
document.getElementById('btnLogin').addEventListener('click', function() {
  var u = document.getElementById('txtUsername').value;
  var p = document.getElementById('txtpassword').value;
  setTimeout(function() {
    if (u === 'Test.Lecturer' && p === 'testpass123') {
      // Break out of the iframe to the top-level dashboard, like the real
      // site's postback would navigate the whole page after auth succeeds.
      var qs = window.location.search;
      var target = 'dashboard.html' + qs;
      if (window.top !== window.self) {
        window.top.location.href = target;
      } else {
        window.location.href = target;
      }
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  }, 300);
});
</script>
</body>
</html>
