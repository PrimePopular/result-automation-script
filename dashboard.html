<!DOCTYPE html>
<html>
<head><title>Staff Dashboard (MOCK)</title></head>
<body id="shell" style="font-family: Arial, sans-serif; margin:0; display:flex; height:100vh;">
  <div style="width:220px; background:#0d2b52; color:white; padding:20px 0;">
    <div style="padding:0 20px 20px 20px; font-weight:bold; border-bottom:1px solid #234; margin-bottom:10px;">
      STAFF PORTAL
    </div>
    <div class="nav-item" data-target="generalsetup/studentcoursemarks.html" style="padding:12px 20px; cursor:pointer;">Course Mark Upload</div>
    <div class="nav-item" data-target="exams-placeholder.html" style="padding:12px 20px; cursor:pointer;">Exam Records</div>
    <div class="nav-item" data-target="profile-placeholder.html" style="padding:12px 20px; cursor:pointer;">My Profile</div>
    <div style="padding:12px 20px; cursor:pointer; margin-top:20px; border-top:1px solid #234;" onclick="window.top.location.href='staff-access.html'">Logout</div>
  </div>
  <div style="flex:1; display:flex; flex-direction:column;">
    <div style="background:#f5f5f5; padding:12px 20px; border-bottom:1px solid #ddd;">
      Logged in as <b>Test.Lecturer</b>
    </div>
    <iframe id="moduleFrame" src="about:blank" style="flex:1; border:none;"></iframe>
  </div>

<script>
document.querySelectorAll('.nav-item[data-target]').forEach(item => {
  item.addEventListener('click', () => {
    document.getElementById('moduleFrame').src = item.dataset.target + window.location.search;
  });
});
// Auto-open Course Mark Upload if navigated here directly (mirrors the
// real site's ModuleId=2 query-param based deep link).
window.addEventListener('load', () => {
  document.getElementById('moduleFrame').src = 'generalsetup/studentcoursemarks.html' + window.location.search;
});
</script>
</body>
</html>
